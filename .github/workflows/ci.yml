name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check that dist/ matches the source
        run: |
          npm run build
          git diff --exit-code -- dist || {
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          }

  # Runs the action itself from this checkout against the example diff.
  # diff-file is set, so nothing is fetched from or posted to any pull request.
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: review
        uses: ./
        with:
          rules: examples/.ai-review.md
          diff-file: examples/sample.diff
      - name: Check outputs
        env:
          FINDINGS: ${{ steps.review.outputs.findings-count }}
          POSTED: ${{ steps.review.outputs.comments-posted }}
        run: |
          echo "findings=$FINDINGS posted=$POSTED"
          test "$FINDINGS" = "4"
          test "$POSTED" = "0"
